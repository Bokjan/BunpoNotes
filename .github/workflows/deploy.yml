name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Sunshine40/mdBook, branch `search-non-english`
  MDBOOK_GIT: https://github.com/Sunshine40/mdBook
  MDBOOK_REV: e06cbc18cc990e461effe63b8bd86b28090fef2e

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache mdBook binary
        id: cache-mdbook
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ env.MDBOOK_REV }}

      # zh-Hans uses the fallback search strategy, which only needs the `search` feature
      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: >
          cargo install mdbook --locked
          --git "$MDBOOK_GIT" --rev "$MDBOOK_REV"
          --no-default-features --features search

      - name: Build book
        run: mdbook build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
